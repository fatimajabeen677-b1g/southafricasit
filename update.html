<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coming Soon - IPTV South Africa</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: #000000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        
        .container {
            text-align: center;
            padding: 20px;
            animation: fadeIn 1.5s ease-in-out;
        }
        
        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: scale(0.9);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }
        
        .logo {
            margin-bottom: 40px;
        }
        
        .logo span {
            font-size: 1.8rem;
            font-weight: 800;
            color: #fff;
        }
        
        .logo .flag {
            font-size: 2rem;
            margin-right: 8px;
        }
        
        .main-text {
            margin-bottom: 20px;
        }
        
        .main-text .stay {
            font-size: 6rem;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 4px;
            display: block;
            line-height: 1.1;
        }
        
        .main-text .tuned {
            font-size: 6rem;
            font-weight: 900;
            background: linear-gradient(135deg, #f7d44a 0%, #f7d44a 40%, #1a8a3f 60%, #1a8a3f 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: block;
            letter-spacing: 4px;
            line-height: 1.1;
        }
        
        .sub-text {
            font-size: 1.4rem;
            color: #94a3b8;
            margin-top: 20px;
            font-weight: 400;
            letter-spacing: 2px;
        }
        
        .sub-text span {
            color: #f7d44a;
            font-weight: 600;
        }
        
        .divider {
            width: 120px;
            height: 4px;
            background: linear-gradient(90deg, #1a8a3f, #f7d44a);
            margin: 30px auto;
            border-radius: 4px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% {
                opacity: 0.6;
                transform: scaleX(0.8);
            }
            50% {
                opacity: 1;
                transform: scaleX(1);
            }
            100% {
                opacity: 0.6;
                transform: scaleX(0.8);
            }
        }
        
        .status-bar {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 40px;
            flex-wrap: wrap;
        }
        
        .status-item {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #94a3b8;
            font-size: 0.9rem;
        }
        
        .status-item .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            animation: blink 1.5s infinite;
        }
        
        .status-item .dot.green {
            background: #1a8a3f;
        }
        
        .status-item .dot.yellow {
            background: #f7d44a;
        }
        
        @keyframes blink {
            0% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
            100% {
                opacity: 1;
            }
        }
        
        .status-item .label {
            color: #cbd5e1;
        }
        
        .status-item .label span {
            color: #f7d44a;
            font-weight: 600;
        }
        
        .loader {
            margin-top: 50px;
            display: flex;
            justify-content: center;
            gap: 12px;
        }
        
        .loader span {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            display: inline-block;
            animation: bounce 1.4s infinite;
        }
        
        .loader span:nth-child(1) {
            background: #1a8a3f;
            animation-delay: 0s;
        }
        
        .loader span:nth-child(2) {
            background: #f7d44a;
            animation-delay: 0.2s;
        }
        
        .loader span:nth-child(3) {
            background: #1a8a3f;
            animation-delay: 0.4s;
        }
        
        .loader span:nth-child(4) {
            background: #f7d44a;
            animation-delay: 0.6s;
        }
        
        @keyframes bounce {
            0%, 80%, 100% {
                transform: scale(0.6);
                opacity: 0.4;
            }
            40% {
                transform: scale(1);
                opacity: 1;
            }
        }
        
        .footer-text {
            margin-top: 60px;
            color: #64748b;
            font-size: 0.85rem;
        }
        
        .footer-text a {
            color: #f7d44a;
            text-decoration: none;
        }
        
        .footer-text a:hover {
            color: #fff;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .main-text .stay,
            .main-text .tuned {
                font-size: 3.5rem;
            }
            
            .sub-text {
                font-size: 1rem;
            }
            
            .status-bar {
                gap: 15px;
            }
            
            .status-item {
                font-size: 0.8rem;
            }
        }
        
        @media (max-width: 480px) {
            .main-text .stay,
            .main-text .tuned {
                font-size: 2.5rem;
            }
            
            .logo span {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Logo -->
        <div class="logo">
            <span class="flag">🇿🇦</span>
            <span>IPTV South Africa</span>
        </div>
        
        <!-- Main Text -->
        <div class="main-text">
            <span class="stay">STAY</span>
            <span class="tuned">TUNED</span>
        </div>
        
        <!-- Divider -->
        <div class="divider"></div>
        
        <!-- Sub Text -->
        <p class="sub-text">
            We're <span>upgrading</span> our service for a better experience
        </p>
        <p class="sub-text" style="font-size: 1rem; margin-top: 8px; color: #64748b;">
            New features coming <span style="color: #1a8a3f;">soon</span>
        </p>
        
        <!-- Status Bar -->
        <div class="status-bar">
            <div class="status-item">
                <span class="dot green"></span>
                <span class="label">Status: <span>Updating</span></span>
            </div>
            <div class="status-item">
                <span class="dot yellow"></span>
                <span class="label">ETA: <span>Coming Soon</span></span>
            </div>
        </div>
        
        <!-- Loader -->
        <div class="loader">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>
        
        <!-- Footer -->
        <div class="footer-text">
            <p>© 2026 <a href="#">IPTV South Africa</a>. All rights reserved. 🇿🇦</p>
        </div>
    </div>
</body>
</html>
